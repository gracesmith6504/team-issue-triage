apiVersion: batch/v1
kind: CronJob
metadata:
  name: triage-hourly
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 600
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: triage
              image: quay.io/rh-ee-grasmith/team-issue-triage:latest
              args: ["--mode", "worker-triage"]
              env:
                - name: DASHBOARD_URL
                  value: "http://triage-dashboard.team-issue-triage.svc:8080"
                - name: DASHBOARD_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: triage-secrets
                      key: API_TOKEN
              envFrom:
                - configMapRef:
                    name: triage-config
                - secretRef:
                    name: triage-secrets
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
              securityContext:
                runAsNonRoot: true
                allowPrivilegeEscalation: false
              volumeMounts:
                - name: gcp-credentials
                  mountPath: /etc/gcp
                  readOnly: true
          volumes:
            - name: gcp-credentials
              secret:
                secretName: gcp-vertex-credentials
