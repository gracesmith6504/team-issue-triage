apiVersion: batch/v1
kind: CronJob
metadata:
  name: triage-hourly
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: triage
              image: quay.io/gracesmith6504/team-issue-triage:latest
              args: ["--mode", "triage"]
              envFrom:
                - configMapRef:
                    name: triage-config
                - secretRef:
                    name: triage-secrets
              volumeMounts:
                - name: state
                  mountPath: /data
          volumes:
            - name: state
              persistentVolumeClaim:
                claimName: triage-state
