# Least-privilege RBAC for the triage CronJob launcher.
# The openshell-sandbox SA only needs to read the two secrets and ConfigMaps
# referenced in cronjob-triage-sandbox.yaml. Everything else is denied.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: triage-launcher
  namespace: openshell
  labels:
    app.kubernetes.io/part-of: team-issue-triage
    app.kubernetes.io/component: triage-worker
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["triage-sandbox-secrets", "openshell-client-tls"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["triage-sandbox-config", "triage-sandbox-policy"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: triage-launcher
  namespace: openshell
  labels:
    app.kubernetes.io/part-of: team-issue-triage
    app.kubernetes.io/component: triage-worker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: triage-launcher
subjects:
  - kind: ServiceAccount
    name: openshell-sandbox
    namespace: openshell
